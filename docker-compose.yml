x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    LOCAL_RAW_DIR: /opt/airflow/data/raw
    LOCAL_PROCESSED_DIR: /opt/airflow/data/processed
    MONGO_URI: mongodb://admin:admin@mongodb:27017/?authSource=admin
    MONGO_DATABASE: github_events
    MONGO_COLLECTION: github_events_raw
    CASSANDRA_HOST: cassandra
    CASSANDRA_PORT: 9042
    CASSANDRA_KEYSPACE: github_events
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: password123
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./requirements.txt:/requirements.txt

services:
  mongodb:
    image: mongo:7
    container_name: bigdata_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db

  cassandra:
    image: cassandra:4.1
    container_name: bigdata_cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: github_events_cluster
      CASSANDRA_NUM_TOKENS: 16
    volumes:
      - cassandra_data:/var/lib/cassandra

  neo4j:
    image: neo4j:5.22
    container_name: bigdata_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data

  postgres-airflow:
    image: postgres:15
    container_name: bigdata_airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    depends_on:
      - postgres-airflow
    command: bash -c "pip install -r /requirements.txt && airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    container_name: bigdata_airflow_webserver
    restart: unless-stopped
    depends_on:
      - airflow-init
    ports:
      - "8080:8080"
    command: bash -c "pip install -r /requirements.txt && airflow webserver"

  airflow-scheduler:
    <<: *airflow-common
    container_name: bigdata_airflow_scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init
    command: bash -c "pip install -r /requirements.txt && airflow scheduler"

  streamlit:
    image: python:3.11-slim
    container_name: bigdata_streamlit
    restart: unless-stopped
    depends_on:
      - mongodb
      - cassandra
    ports:
      - "8501:8501"
    environment:
      LOCAL_RAW_DIR: /app/data/raw
      LOCAL_PROCESSED_DIR: /app/data/processed
      MONGO_URI: mongodb://admin:admin@mongodb:27017/?authSource=admin
      MONGO_DATABASE: github_events
      MONGO_COLLECTION: github_events_raw
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: github_events
    volumes:
      - ./dashboard:/app/dashboard
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./requirements.txt:/requirements.txt
    working_dir: /app
    command: bash -c "pip install -r /requirements.txt && streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501"

volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:
  postgres_data:
